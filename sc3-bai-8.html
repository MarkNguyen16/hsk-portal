.btn-submit-exam {

.section-card {

}
.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-badge {
  font-size: 12px;
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
}
.part-header {
  background: #f8fafc;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 14px;
  color: #334155;
  margin-bottom: 16px;
}

/* Question items */
.question-item {
  border-bottom: 1px solid var(--border-light);
  padding: 16px 0;
}
.question-item:last-child {

}
.q-header {

  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.q-number {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
}
.btn-tts-replay {
  background: none;
  border: 1px solid var(--border-medium);
  color: var(--text-muted);
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
}
.btn-tts-replay:hover {
  color: var(--primary);
  border-color: var(--primary);
}

/* Images Bank */
.image-bank-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.image-bank-item {
  border: 1px solid var(--border-medium);
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  text-align: center;
}
.image-desc {
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px;
  background: #f8fafc;
}
.bank-options-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.btn-bank-opt {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border-medium);
  background: #fff;
  border-radius: 6px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-bank-opt:hover {
  border-color: var(--primary);
}
.btn-bank-opt.selected {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* Choices */
.choice-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.choice-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid var(--border-light);
  border-radius: 8px;
  cursor: pointer;
  background: #fff;
  transition: all 0.15s;
}
.choice-item:hover {
  border-color: var(--primary);
  background: #fdfdfd;
}
.choice-item.selected {
  background: var(--primary-light);
  border-color: var(--primary);
}
.choice-badge {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-main);
}
.choice-item.selected .choice-badge {
  background: var(--primary);
  color: #fff;
}

/* Judge */
.judge-btn-group {
  display: flex;
  gap: 12px;
}
.btn-judge {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--border-medium);
  background: #fff;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-judge.selected-true {
  background: #dcfce7;
  border-color: var(--success);
  color: #15803d;
}
.btn-judge.selected-false {
  background: #fee2e2;
  border-color: var(--danger);
  color: #b91c1c;
}

/* Drawer */
.persistent-drawer {
  position: fixed;
  top: var(--header-height);
  right: -320px;
  width: 320px;
  height: calc(100vh - var(--header-height));
  background: #ffffff;
  border-left: 1px solid var(--border-light);
  box-shadow: -2px 0 8px rgba(0,0,0,0.05);
  transition: right 0.3s ease;
  z-index: 999;
  display: flex;
  flex-direction: column;
}
.persistent-drawer.open {
  right: 0;
}
.drawer-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
.drawer-section-title {
  font-size: 13px;
  font-weight: bold;
  color: var(--primary-dark);
  margin: 14px 0 8px 0;
  border-bottom: 1px solid var(--border-light);
  padding-bottom: 4px;
}
.drawer-subgrid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.drawer-q-btn {
  height: 36px;
  border: 1px solid var(--border-medium);
  background: #fff;
  border-radius: 6px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}
.drawer-q-btn.answered {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.drawer-q-btn.correct-rev {
  background: var(--success) !important;
  color: #fff !important;
}
.drawer-q-btn.wrong-rev {
  background: var(--danger) !important;
  color: #fff !important;
}

/* Writing elements */
.word-chips-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.word-chip {
  background: #f1f5f9;
  border: 1px solid var(--border-medium);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
}
.word-chip.used {
  opacity: 0.35;
  pointer-events: none;
}
.writing-input-sentence {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--border-medium);
  border-radius: 6px;
  font-size: 16px;
}
.btn-clear-chips {
  background: #f1f5f9;
  border: 1px solid var(--border-medium);
  padding: 0 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.char-fill-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  margin: 12px 0;
}
.char-input-box {
  width: 44px;
  height: 44px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  border: 2px solid var(--border-medium);
  border-radius: 8px;
  outline: none;
  color: var(--primary-dark);
  background: #fff;
}
.char-input-box:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(22, 107, 99, 0.15);
}
.pinyin-highlight {
  font-weight: bold;
  color: var(--primary);
  background: rgba(22, 107, 99, 0.08);
  padding: 2px 8px;
  border-radius: 4px;
}
.options-box {
  background: #f8fafc;
  border: 1px solid var(--border-medium);
  border-radius: 8px;
  padding: 12px 16px;
  margin: 12px 0 16px 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px;
}
.options-box-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
}
.opt-letter {
  background: var(--primary);
  color: #fff;
  font-weight: bold;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}
.reading-passage {
  background: #fdfbf7;
  border-left: 4px solid var(--primary);
  padding: 14px 18px;
  font-size: 17px;
  line-height: 1.7;
  border-radius: 0 8px 8px 0;
  margin-bottom: 12px;
}
.reading-question {
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 12px;
  color: #1e293b;
}
.dialogue-transcript {
  background: #f8fafc;
  padding: 10px 14px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 16px;
  line-height: 1.6;
}
.example-box {
  background: #f1f5f9;
  border: 1px dashed #94a3b8;
  border-radius: 8px;
  padding: 12px 16px;
  margin: 12px 0 18px 0;
  font-size: 15px;
}
.example-title {
  font-weight: bold;
  color: #475569;
  display: block;
  margin-bottom: 6px;
}
.example-answer {
  font-weight: bold;
  color: var(--primary);
}
.explanation-box {
  display: none;
  margin-top: 12px;
  padding: 12px 14px;
  background: #fefce8;
  border: 1px solid #fef08a;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
  color: #854d0e;
}
body.review-mode .explanation-box {
  display: block !important;
}

/* Welcome Modal */
.welcome-modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(15, 23, 42, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}
.welcome-modal-card {
  background: #fff;
  border-radius: 12px;
  max-width: 480px;
  width: 90%;
  padding: 24px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
.modal-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 12px;
}
.modal-input {

  padding: 10px 14px;
  border: 1px solid var(--border-medium);
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 16px;
}
.btn-modal-start {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}
</style>
</head>

function randomizeExamData() {
  activeData = JSON.parse(JSON.stringify(MASTER_DATA));

  // Listening Part 1
  if (activeData.listening && activeData.listening.part1) {
    const p1 = activeData.listening.part1;
    const letters = ['A','B','C','D','E','F'];
    p1.images.forEach((img, idx) => {
      img.currentLetter = letters[idx];
    });
    p1.questions.forEach(q => {
      const matched = p1.images.find(im => im.id === q.correctId);
      q.correctLetter = matched ? matched.currentLetter : '';
    });
    if (p1.example) {
      const exImg = p1.images.find(im => im.id === p1.example.correctId);
      p1.example.currentLetter = exImg ? exImg.currentLetter : 'D';
    }
  }

  // Listening Part 3 & 4
  ['part3', 'part4'].forEach(partKey => {
    if (activeData.listening && activeData.listening[partKey]) {
      activeData.listening[partKey].questions.forEach(q => {
        const letters = ['A','B','C'];
        q.options.forEach((opt, idx) => {
          opt.currentLetter = letters[idx];
        });
        const matched = q.options.find(o => o.id === q.correctId);
        q.correctLetter = matched ? matched.currentLetter : '';
      });
    }
  });

  // Reading Part 1 & 2
  ['part1', 'part2'].forEach(partKey => {
    if (activeData.reading && activeData.reading[partKey]) {
      const p = activeData.reading[partKey];
      const letters = ['A','B','C','D','E','F'];
      p.options.forEach((opt, idx) => {
        opt.currentLetter = letters[idx];
      });
      p.questions.forEach(q => {
        const matched = p.options.find(o => o.id === q.correctId);
        q.correctLetter = matched ? matched.currentLetter : '';
      });
    }
  });

  // Reading Part 3
  if (activeData.reading && activeData.reading.part3) {
    activeData.reading.part3.questions.forEach(q => {
      const letters = ['A','B','C'];
      q.options.forEach((opt, idx) => {
        opt.currentLetter = letters[idx];
      });
      const matched = q.options.find(o => o.id === q.correctId);
      q.correctLetter = matched ? matched.currentLetter : '';
    });
  }

  // Writing Part 1
  if (activeData.writing && activeData.writing.part1) {
    activeData.writing.part1.questions.forEach(q => {
      q.shuffledWords = [...q.words];
    });
  }
}

function escapeJsStr(str) {
  if (!str) return '';
  return str.split('\\\\').join('\\\\\\\\').split("'").join("\\\\'").split('\\n').join(' ');
}

        <div class="reading-question chinese">★ ${q.question}</div>
        <div class="choice-list">
          ${q.options.map(opt => `
            <div class="choice-item" id="opt-${q.id}-${opt.id}" onclick="selectChoiceOption('${q.id}', '${opt.id}', this)">
              <span class="choice-badge">${opt.currentLetter}</span>
              <span class="choice-text chinese">${opt.text}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="explanation-box" id="exp-${q.id}">
        <strong>💡 Giải thích:</strong> ${q.explanation}
      </div>
    `;
    rp3.appendChild(qDiv);
  });
  secReading.appendChild(rp3);
  container.appendChild(secReading);

  // SECTION 3: WRITING (36 - 45)
  const secWriting = document.createElement("section");
  secWriting.id = "sec-writing";
  secWriting.className = "section-card";
  secWriting.innerHTML = `
    <div class="section-card-header">
      <div class="section-title">
        <span>✍️</span> Phần 3: Viết (三、书写)
      </div>
      <div class="section-badge">10 Câu (约 15 分钟)</div>
    </div>
  `;

  // --- Writing Part 1 (36 - 40) ---
  const wp1 = document.createElement("div");
  wp1.innerHTML = `
    <div class="part-header">
      <strong>第一部分 (Phần 1):</strong> Câu 36-40. Sắp xếp các từ/cụm từ xáo trộn thành câu hoàn chỉnh. Nhấp vào các thẻ từ hoặc gõ trực tiếp câu trả lời vào ô trống.
    </div>
  `;
  activeData.writing.part1.questions.forEach(q => {
    const qDiv = document.createElement("div");
    qDiv.className = "question-item";
    qDiv.id = `qbox-${q.id}`;
    qDiv.innerHTML = `
      <div class="q-header"><span class="q-number">Câu ${q.num}</span></div>
      <div class="q-body">
        <div class="word-chips-container" id="chips-${q.id}">
          ${q.shuffledWords.map((w, idx) => `
            <button class="word-chip chinese" id="chip-${q.id}-${idx}" onclick="clickWordChip('${q.id}', ${idx}, '${escapeJsStr(w)}')">
              ${w}
            </button>
          `).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <input type="text" class="writing-input-sentence chinese" id="input-${q.id}" placeholder="Bấm các thẻ từ ở trên hoặc nhập câu vào đây..." oninput="onSentenceInputChange('${q.id}', this.value)">
          <button class="btn-clear-chips" onclick="clearWordOrder('${q.id}')">Xóa làm lại</button>
        </div>
      </div>
      <div class="explanation-box" id="exp-${q.id}">
        <strong>💡 Đáp án đúng:</strong> <span class="chinese" style="font-weight:bold;color:var(--primary);">${q.correct}</span><br>
        <strong>💡 Giải thích:</strong> ${q.explanation}
      </div>
    `;
    wp1.appendChild(qDiv);
  });
  secWriting.appendChild(wp1);

  // --- Writing Part 2 (41 - 45) ---
  const wp2 = document.createElement("div");
  wp2.innerHTML = `
    <div class="part-header" style="margin-top:24px;">
      <strong>第二部分 (Phần 2):</strong> Câu 41-45. Viết chữ Hán chính xác tương ứng với phiên âm Pinyin trong ngoặc đơn.
    </div>
  `;
  activeData.writing.part2.questions.forEach(q => {
    const qDiv = document.createElement("div");
    qDiv.className = "question-item";
    qDiv.id = `qbox-${q.id}`;
    qDiv.innerHTML = `
      <div class="q-header"><span class="q-number">Câu ${q.num}</span></div>
      <div class="q-body">
        <div class="char-fill-row chinese">
          <span>${q.before}</span>
          <span class="pinyin-highlight">${q.pinyin}</span>
          <span>${q.after}</span>
          <input type="text" maxlength="1" class="char-input-box chinese" id="input-${q.id}" oninput="onCharInputChange('${q.id}', this.value)">
        </div>
      </div>
      <div class="explanation-box" id="exp-${q.id}">
        <strong>💡 Chữ Hán đúng:</strong> <span class="chinese" style="font-size:20px;font-weight:bold;color:var(--primary);">${q.correct}</span> (${q.pinyin})<br>
        <strong>💡 Giải thích:</strong> ${q.explanation}
      </div>
    `;
    wp2.appendChild(qDiv);
  });
  secWriting.appendChild(wp2);
  container.appendChild(secWriting);

  renderDrawerGrid();
}

function renderDrawerGrid() {
  const grid = document.getElementById("drawerGrid");
  if (!grid) return;
  grid.innerHTML = "";
  
  const sections = [
    { name: "Phần 1: Nghe hiểu (1 - 20)", start: 1, end: 20 },
    { name: "Phần 2: Đọc hiểu (21 - 35)", start: 21, end: 35 },
    { name: "Phần 3: Viết (36 - 45)", start: 36, end: 45 }
  ];

  sections.forEach(sec => {
    const header = document.createElement("div");
    header.className = "drawer-section-title";
    header.textContent = sec.name;
    grid.appendChild(header);

    const subGrid = document.createElement("div");
    subGrid.className = "drawer-subgrid";
    for (let i = sec.start; i <= sec.end; i++) {
      const btn = document.createElement("button");
      btn.className = "drawer-q-btn";
      btn.id = `drawer-btn-${i}`;
      btn.textContent = i;
      btn.onclick = () => scrollToQuestion(i);
      subGrid.appendChild(btn);
    }
    grid.appendChild(subGrid);
  });
}

function scrollToQuestion(num) {
  let qId = '';
  if (num <= 20) qId = `L${num}`;
  else if (num <= 35) qId = `R${num}`;
  else qId = `W${num}`;

  const el = document.getElementById(`qbox-${qId}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function selectBankOption(qId, optId, btnEl) {
  if (isExamSubmitted) return;
  const parent = btnEl.parentElement;
  parent.querySelectorAll('.btn-bank-opt').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');
  userAnswers[qId] = optId;
  updateProgress();
}

function selectJudgeOption(qId, boolVal, btnEl) {
  if (isExamSubmitted) return;
  const parent = btnEl.parentElement;
  parent.querySelectorAll('.btn-judge').forEach(b => {
    b.classList.remove('selected-true', 'selected-false');
  });
  btnEl.classList.add(boolVal ? 'selected-true' : 'selected-false');
  userAnswers[qId] = boolVal;
  updateProgress();
}

function selectChoiceOption(qId, optId, itemEl) {
  if (isExamSubmitted) return;
  const parent = itemEl.parentElement;
  parent.querySelectorAll('.choice-item').forEach(c => c.classList.remove('selected'));
  itemEl.classList.add('selected');
  userAnswers[qId] = optId;
  updateProgress();
}

function clickWordChip(qId, idx, word) {
  if (isExamSubmitted) return;
  const chip = document.getElementById(`chip-${qId}-${idx}`);
  if (!chip || chip.classList.contains('used')) return;
  chip.classList.add('used');

  const input = document.getElementById(`input-${qId}`);
  let currentVal = input.value.trim();
  if (currentVal.endsWith('。') || currentVal.endsWith('？') || currentVal.endsWith('！')) {
    currentVal = currentVal.slice(0, -1);
  }
  input.value = currentVal + word;
  userAnswers[qId] = input.value;
  updateProgress();
}

function clearWordOrder(qId) {
  if (isExamSubmitted) return;
  const container = document.getElementById(`chips-${qId}`);
  if (container) {
    container.querySelectorAll('.word-chip').forEach(c => c.classList.remove('used'));
  }
  const input = document.getElementById(`input-${qId}`);
  if (input) {
    input.value = '';
  }
  delete userAnswers[qId];
  updateProgress();
}

function onSentenceInputChange(qId, val) {
  if (isExamSubmitted) return;
  if (val.trim()) {
    userAnswers[qId] = val.trim();
  } else {
    delete userAnswers[qId];
  }
  updateProgress();
}

function onCharInputChange(qId, val) {
  if (isExamSubmitted) return;
  if (val.trim()) {
    userAnswers[qId] = val.trim();
  } else {
    delete userAnswers[qId];
  }
  updateProgress();
}

function updateProgress() {
  const answeredCount = Object.keys(userAnswers).length;
  const navCountEl = document.getElementById("navAnsweredCount");
  if (navCountEl) navCountEl.textContent = answeredCount;

  for (let i = 1; i <= 45; i++) {
    let qId = '';
    if (i <= 20) qId = `L${i}`;
    else if (i <= 35) qId = `R${i}`;
    else qId = `W${i}`;

    const btn = document.getElementById(`drawer-btn-${i}`);
    if (btn) {
      if (userAnswers[qId] !== undefined && userAnswers[qId] !== '') {
        btn.classList.add('answered');
      } else {
        btn.classList.remove('answered');
      }
    }
  }
}

function toggleExamDrawer() {
  const drawer = document.getElementById("examDrawer");
  if (!drawer) return;
  drawer.classList.toggle("open");
  document.body.classList.toggle("drawer-open");
}

function startExamSession() {
  const nameInput = document.getElementById("inputStudentName");
  if (nameInput && nameInput.value.trim()) {
    studentName = nameInput.value.trim();
  }
  const badge = document.getElementById("studentInfoBadge");
  if (badge) badge.textContent = `👤 ${studentName}`;

  const modal = document.getElementById("welcomeModal");
  if (modal) modal.style.display = "none";

  randomizeExamData();
  renderExam();
  startTimers();
}

function startTimers() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (totalSeconds > 0) {
      totalSeconds--;
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      const el = document.getElementById("totalTimerText");
      if (el) el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    if (listeningSeconds > 0) {
      listeningSeconds--;
      const lm = Math.floor(listeningSeconds / 60);
      const ls = listeningSeconds % 60;
      const lel = document.getElementById("listeningTimerText");
      if (lel) lel.textContent = `${String(lm).padStart(2, '0')}:${String(ls).padStart(2, '0')}`;
    }

    if (totalSeconds <= 0) {
      clearInterval(timerInterval);
      alert("Đã hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
      submitExam();
    }
  }, 1000);
}

function playQuestionSnippet(timestamp, text) {
  const audio = document.getElementById("mainAudioPlayer");
  if (audio && audio.src && !audio.error) {
    audio.currentTime = timestamp;
    audio.play();
  } else {
    speakChineseText(text);
  }
}

function speakChineseText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'zh-CN';
  utt.rate = 0.9;
  window.speechSynthesis.speak(utt);
}

function confirmSubmitExam() {
  const answered = Object.keys(userAnswers).length;
  const unanswered = 45 - answered;
  let msg = `Bạn đã hoàn thành ${answered}/45 câu.`;
  if (unanswered > 0) {
    msg += ` Còn ${unanswered} câu chưa trả lời. Bạn có chắc chắn muốn nộp bài?`;
  } else {
    msg += ` Bạn có chắc chắn muốn nộp bài để xem kết quả?`;
  }
  if (confirm(msg)) {
    submitExam();
  }
}

function submitExam() {
  if (isExamSubmitted) return;
  isExamSubmitted = true;
  if (timerInterval) clearInterval(timerInterval);

  let correctCount = 0;
  const results = {};

  // 1. Listening Part 1 (1-5)
  activeData.listening.part1.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 2. Listening Part 2 (6-10)
  activeData.listening.part2.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correct;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correct, isCor };
  });

  // 3. Listening Part 3 (11-15)
  activeData.listening.part3.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 4. Listening Part 4 (16-20)
  activeData.listening.part4.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 5. Reading Part 1 (21-25)
  activeData.reading.part1.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 6. Reading Part 2 (26-30)
  activeData.reading.part2.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 7. Reading Part 3 (31-35)
  activeData.reading.part3.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 8. Writing Part 1 (36-40)
  activeData.writing.part1.questions.forEach(q => {
    const user = (userAnswers[q.id] || '').replace(/[。？！?!\\s]/g, '');
    const cor = q.correct.replace(/[。？！?!\\s]/g, '');
    const isCor = user === cor;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user: userAnswers[q.id], correct: q.correct, isCor };
  });

  // 9. Writing Part 2 (41-45)
  activeData.writing.part2.questions.forEach(q => {
    const user = (userAnswers[q.id] || '').trim();
    const isCor = user === q.correct;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correct, isCor };
  });

  let correctL = 0, correctR = 0, correctW = 0;
  for (let i = 1; i <= 45; i++) {
    let qId = (i <= 20) ? `L${i}` : (i <= 35) ? `R${i}` : `W${i}`;
    const res = results[qId];
    if (res && res.isCor) {
      if (i <= 20) correctL++;
      else if (i <= 35) correctR++;
      else correctW++;
    }
  }

  const finalScore10 = ((correctCount / 45) * 10).toFixed(1);
  const isPassed = (correctCount >= 27);
  const hskTotal = Math.round((correctCount / 45) * 300);

  const durationSec = (45 * 60) - totalSeconds;
  const dm = Math.floor(durationSec / 60);
  const ds = durationSec % 60;
  const durationFormatted = `${dm} phút ${ds < 10 ? '0' + ds : ds} giây`;

  const detailedSummary = [];
  for (let i = 1; i <= 45; i++) {
    let qId = (i <= 20) ? `L${i}` : (i <= 35) ? `R${i}` : `W${i}`;
    const res = results[qId];
    detailedSummary.push({
      num: i,
      qId: qId,
      userAns: res ? (res.user ?? "Chưa làm") : "Chưa làm",
      correctAns: res ? res.correct : "",
      isCorrect: res ? res.isCor : false
    });
  }

  let attemptCount = parseInt(localStorage.getItem(`attempt_${EXAM_CONFIG.examCode}`) || "0") + 1;
  localStorage.setItem(`attempt_${EXAM_CONFIG.examCode}`, attemptCount);

  // Payload for teacher dashboard (teacher.html) and Firebase Realtime Database
  const submissionPayload = {
    studentName: studentName || "Thí sinh",
    studentClass: studentClass || "Tự do",
    examCode: EXAM_CONFIG.examCode,
    examTitle: EXAM_CONFIG.examTitle,
    attemptCount: attemptCount,
    durationFormatted: durationFormatted,
    score10: parseFloat(finalScore10),
    hskTotal: hskTotal,
    hskListening: `${correctL}/20`,
    hskReading: `${correctR}/15`,
    hskWriting: `${correctW}/10`,
    correctCount: correctCount,
    totalQuestions: 45,
    percent: Math.round((correctCount / 45) * 100),
    isPassed: isPassed,
    submitTime: new Date().toISOString(),
    detailedSummary: detailedSummary
  };

  // 1. Post to submissions.json (Read by Teacher Dashboard teacher.html)
  fetch("https://diemthihsk-marknguyen-default-rtdb.firebaseio.com/submissions.json", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(submissionPayload)
  }).then(r => r.json()).then(d => {
    console.log("Firebase sync to teacher dashboard success:", d);
    const syncEl = document.getElementById("firebaseSyncStatus");
    if (syncEl) {
      syncEl.innerHTML = `<span>🟢 Đã gửi bài nộp về hệ thống giáo viên (Firebase Realtime Database) thành công (${new Date().toLocaleTimeString('vi-VN')})</span>`;
      syncEl.className = "sync-status-box success";
      syncEl.style.display = "block";
    }
  }).catch(err => {
    console.warn("Firebase sync error:", err);
    const syncEl = document.getElementById("firebaseSyncStatus");
    if (syncEl) {
      syncEl.innerHTML = `<span>⚠️ Không thể kết nối mạng, kết quả đã lưu tạm trong bộ nhớ máy học sinh.</span>`;
      syncEl.className = "sync-status-box offline";
      syncEl.style.display = "block";
    }
  });

  // 2. Backup post to scores.json
  fetch("https://diemthihsk-marknguyen-default-rtdb.firebaseio.com/scores.json", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(submissionPayload)
  }).catch(e => {});

  // 3. Local history
  try {
    const hist = JSON.parse(localStorage.getItem("hsk3_exam_history") || "[]");
    hist.unshift(submissionPayload);
    localStorage.setItem("hsk3_exam_history", JSON.stringify(hist.slice(0, 50)));

    const allSub = JSON.parse(localStorage.getItem("hsk3_all_class_submissions") || "[]");
    allSub.unshift(submissionPayload);
    localStorage.setItem("hsk3_all_class_submissions", JSON.stringify(allSub.slice(0, 100)));
  } catch(e) {}

  // Enter review mode
  document.body.classList.add("review-mode");
  
  // Highlight drawer buttons
  for (let i = 1; i <= 45; i++) {
    let qId = '';
    if (i <= 20) qId = `L${i}`;
    else if (i <= 35) qId = `R${i}`;
    else qId = `W${i}`;

    const res = results[qId];
    const btn = document.getElementById(`drawer-btn-${i}`);
    if (btn && res) {
      if (res.isCor) {
        btn.classList.add('correct-rev');
      } else {
        btn.classList.add('wrong-rev');
      }
    }
  }

  // Open drawer to see review
  const drawer = document.getElementById("examDrawer");
  if (drawer && !drawer.classList.contains("open")) {
    toggleExamDrawer();
  }

  alert(`KẾT QUẢ BÀI LÀM:\\n\\nThí sinh: ${studentName}\\nĐúng: ${correctCount}/45 câu\\nĐiểm số: ${finalScore10}/10\\n\\nBài làm đã được chuyển sang chế độ Xem Lại với đầy đủ đáp án và giải thích chi tiết.`);
}

// Initialize: Render exam immediately on DOM ready
window.addEventListener("DOMContentLoaded", () => {
  randomizeExamData();
  renderExam();
});
</script>
</body>
</html>
