function randomizeExamData() {
  activeData = JSON.parse(JSON.stringify(MASTER_DATA));

  // Listening Part 1
  if (activeData.listening && activeData.listening.part1) {
    const p1 = activeData.listening.part1;
    const letters = ['A','B','C','D','E','F'];
    p1.images.forEach((img, idx) => {
      img.currentLetter = letters[idx];
    });
    p1.questions.forEach(q => {
      const matched = p1.images.find(im => im.id === q.correctId);
      q.correctLetter = matched ? matched.currentLetter : '';
    });
    if (p1.example) {
      const exImg = p1.images.find(im => im.id === p1.example.correctId);
      p1.example.currentLetter = exImg ? exImg.currentLetter : 'D';
    }
  }

  // Listening Part 3 & 4
  ['part3', 'part4'].forEach(partKey => {
    if (activeData.listening && activeData.listening[partKey]) {
      activeData.listening[partKey].questions.forEach(q => {
        const letters = ['A','B','C'];
        q.options.forEach((opt, idx) => {
          opt.currentLetter = letters[idx];
        });
        const matched = q.options.find(o => o.id === q.correctId);
        q.correctLetter = matched ? matched.currentLetter : '';
      });
    }
  });

  // Reading Part 1 & 2
  ['part1', 'part2'].forEach(partKey => {
    if (activeData.reading && activeData.reading[partKey]) {
      const p = activeData.reading[partKey];
      const letters = ['A','B','C','D','E','F'];
      p.options.forEach((opt, idx) => {
        opt.currentLetter = letters[idx];
      });
      p.questions.forEach(q => {
        const matched = p.options.find(o => o.id === q.correctId);
        q.correctLetter = matched ? matched.currentLetter : '';
      });
    }
  });

  // Reading Part 3
  if (activeData.reading && activeData.reading.part3) {
    activeData.reading.part3.questions.forEach(q => {
      const letters = ['A','B','C'];
      q.options.forEach((opt, idx) => {
        opt.currentLetter = letters[idx];
      });
      const matched = q.options.find(o => o.id === q.correctId);
      q.correctLetter = matched ? matched.currentLetter : '';
    });
  }

  // Writing Part 1
  if (activeData.writing && activeData.writing.part1) {
    activeData.writing.part1.questions.forEach(q => {
      q.shuffledWords = [...q.words];
    });
  }
}

function escapeJsStr(str) {
  if (!str) return '';
  return str.split('\\\\').join('\\\\\\\\').split("'").join("\\\\'").split('\\n').join(' ');
}

function renderDrawerGrid() {
  const grid = document.getElementById("drawerGrid");
  if (!grid) return;
  grid.innerHTML = "";
  
  const sections = [
    { name: "Phần 1: Nghe hiểu (1 - 20)", start: 1, end: 20 },
    { name: "Phần 2: Đọc hiểu (21 - 35)", start: 21, end: 35 },
    { name: "Phần 3: Viết (36 - 45)", start: 36, end: 45 }
  ];

  sections.forEach(sec => {
    const header = document.createElement("div");
    header.className = "drawer-section-title";
    header.textContent = sec.name;
    grid.appendChild(header);

    const subGrid = document.createElement("div");
    subGrid.className = "drawer-subgrid";
    for (let i = sec.start; i <= sec.end; i++) {
      const btn = document.createElement("button");
      btn.className = "drawer-q-btn";
      btn.id = `drawer-btn-${i}`;
      btn.textContent = i;
      btn.onclick = () => scrollToQuestion(i);
      subGrid.appendChild(btn);
    }
    grid.appendChild(subGrid);
  });
}

function scrollToQuestion(num) {
  let qId = '';
  if (num <= 20) qId = `L${num}`;
  else if (num <= 35) qId = `R${num}`;
  else qId = `W${num}`;

  const el = document.getElementById(`qbox-${qId}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function selectBankOption(qId, optId, btnEl) {
  if (isExamSubmitted) return;
  const parent = btnEl.parentElement;
  parent.querySelectorAll('.btn-bank-opt').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');
  userAnswers[qId] = optId;
  updateProgress();
}

function selectJudgeOption(qId, boolVal, btnEl) {
  if (isExamSubmitted) return;
  const parent = btnEl.parentElement;
  parent.querySelectorAll('.btn-judge').forEach(b => {
    b.classList.remove('selected-true', 'selected-false');
  });
  btnEl.classList.add(boolVal ? 'selected-true' : 'selected-false');
  userAnswers[qId] = boolVal;
  updateProgress();
}

function selectChoiceOption(qId, optId, itemEl) {
  if (isExamSubmitted) return;
  const parent = itemEl.parentElement;
  parent.querySelectorAll('.choice-item').forEach(c => c.classList.remove('selected'));
  itemEl.classList.add('selected');
  userAnswers[qId] = optId;
  updateProgress();
}

function clickWordChip(qId, idx, word) {
  if (isExamSubmitted) return;
  const chip = document.getElementById(`chip-${qId}-${idx}`);
  if (!chip || chip.classList.contains('used')) return;
  chip.classList.add('used');

  const input = document.getElementById(`input-${qId}`);
  let currentVal = input.value.trim();
  if (currentVal.endsWith('。') || currentVal.endsWith('？') || currentVal.endsWith('！')) {
    currentVal = currentVal.slice(0, -1);
  }
  input.value = currentVal + word;
  userAnswers[qId] = input.value;
  updateProgress();
}

function clearWordOrder(qId) {
  if (isExamSubmitted) return;
  const container = document.getElementById(`chips-${qId}`);
  if (container) {
    container.querySelectorAll('.word-chip').forEach(c => c.classList.remove('used'));
  }
  const input = document.getElementById(`input-${qId}`);
  if (input) {
    input.value = '';
  }
  delete userAnswers[qId];
  updateProgress();
}

function onSentenceInputChange(qId, val) {
  if (isExamSubmitted) return;
  if (val.trim()) {
    userAnswers[qId] = val.trim();
  } else {
    delete userAnswers[qId];
  }
  updateProgress();
}

function onCharInputChange(qId, val) {
  if (isExamSubmitted) return;
  if (val.trim()) {
    userAnswers[qId] = val.trim();
  } else {
    delete userAnswers[qId];
  }
  updateProgress();
}

function updateProgress() {
  const answeredCount = Object.keys(userAnswers).length;
  const navCountEl = document.getElementById("navAnsweredCount");
  if (navCountEl) navCountEl.textContent = answeredCount;

  for (let i = 1; i <= 45; i++) {
    let qId = '';
    if (i <= 20) qId = `L${i}`;
    else if (i <= 35) qId = `R${i}`;
    else qId = `W${i}`;

    const btn = document.getElementById(`drawer-btn-${i}`);
    if (btn) {
      if (userAnswers[qId] !== undefined && userAnswers[qId] !== '') {
        btn.classList.add('answered');
      } else {
        btn.classList.remove('answered');
      }
    }
  }
}

function toggleExamDrawer() {
  const drawer = document.getElementById("examDrawer");
  if (!drawer) return;
  drawer.classList.toggle("open");
  document.body.classList.toggle("drawer-open");
}

function startExamSession() {
  const nameInput = document.getElementById("inputStudentName");
  const classInput = document.getElementById("inputStudentClass");
  if (nameInput && nameInput.value.trim()) {
    studentName = nameInput.value.trim();
    localStorage.setItem("hsk3_student_name", studentName);
  }
  if (classInput && classInput.value.trim()) {
    studentClass = classInput.value.trim();
    localStorage.setItem("hsk3_student_class", studentClass);
  }
  const badge = document.getElementById("studentInfoBadge");
  if (badge) badge.textContent = `👤 ${studentName} (${studentClass})`;

  const modal = document.getElementById("welcomeModal");
  if (modal) modal.style.display = "none";

  startTimers();
}

function startTimers() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (totalSeconds > 0) {
      totalSeconds--;
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      const el = document.getElementById("totalTimerText");
      if (el) el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    if (listeningSeconds > 0) {
      listeningSeconds--;
      const lm = Math.floor(listeningSeconds / 60);
      const ls = listeningSeconds % 60;
      const lel = document.getElementById("listeningTimerText");
      if (lel) lel.textContent = `${String(lm).padStart(2, '0')}:${String(ls).padStart(2, '0')}`;
    }

    if (totalSeconds <= 0) {
      clearInterval(timerInterval);
      alert("Đã hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
      submitExam();
    }
  }, 1000);
}

function playQuestionSnippet(timestamp, text) {
  const audio = document.getElementById("mainAudioPlayer");
  if (audio && audio.src && !audio.error) {
    audio.currentTime = timestamp;
    audio.play();
  } else {
    speakChineseText(text);
  }
}

function speakChineseText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'zh-CN';
  utt.rate = 0.9;
  window.speechSynthesis.speak(utt);
}

function confirmSubmitExam() {
  const answered = Object.keys(userAnswers).length;
  const unanswered = 45 - answered;
  let msg = `Bạn đã hoàn thành ${answered}/45 câu.`;
  if (unanswered > 0) {
    msg += ` Còn ${unanswered} câu chưa trả lời. Bạn có chắc chắn muốn nộp bài?`;
  } else {
    msg += ` Bạn có chắc chắn muốn nộp bài để xem kết quả?`;
  }
  if (confirm(msg)) {
    submitExam();
  }
}

function submitExam() {
  if (isExamSubmitted) return;
  isExamSubmitted = true;
  if (timerInterval) clearInterval(timerInterval);

  let correctCount = 0;
  const results = {};

  // 1. Listening Part 1 (1-5)
  activeData.listening.part1.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 2. Listening Part 2 (6-10)
  activeData.listening.part2.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correct;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correct, isCor };
  });

  // 3. Listening Part 3 (11-15)
  activeData.listening.part3.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 4. Listening Part 4 (16-20)
  activeData.listening.part4.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 5. Reading Part 1 (21-25)
  activeData.reading.part1.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 6. Reading Part 2 (26-30)
  activeData.reading.part2.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 7. Reading Part 3 (31-35)
  activeData.reading.part3.questions.forEach(q => {
    const user = userAnswers[q.id];
    const isCor = user === q.correctId;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correctId, isCor };
  });

  // 8. Writing Part 1 (36-40)
  activeData.writing.part1.questions.forEach(q => {
    const user = (userAnswers[q.id] || '').replace(/[。？！?!\\s]/g, '');
    const cor = q.correct.replace(/[。？！?!\\s]/g, '');
    const isCor = user === cor;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user: userAnswers[q.id], correct: q.correct, isCor };
  });

  // 9. Writing Part 2 (41-45)
  activeData.writing.part2.questions.forEach(q => {
    const user = (userAnswers[q.id] || '').trim();
    const isCor = user === q.correct;
    if (isCor) correctCount++;
    results[q.id] = { num: q.num, user, correct: q.correct, isCor };
  });

  let correctL = 0, correctR = 0, correctW = 0;
  for (let i = 1; i <= 45; i++) {
    let qId = (i <= 20) ? `L${i}` : (i <= 35) ? `R${i}` : `W${i}`;
    const res = results[qId];
    if (res && res.isCor) {
      if (i <= 20) correctL++;
      else if (i <= 35) correctR++;
      else correctW++;
    }
  }

  const finalScore10 = ((correctCount / 45) * 10).toFixed(1);
  const isPassed = (correctCount >= 27);
  const hskTotal = Math.round((correctCount / 45) * 300);

  const durationSec = (45 * 60) - totalSeconds;
  const dm = Math.floor(durationSec / 60);
  const ds = durationSec % 60;
  const durationFormatted = `${dm} phút ${ds < 10 ? '0' + ds : ds} giây`;

  const detailedSummary = [];
  for (let i = 1; i <= 45; i++) {
    let qId = (i <= 20) ? `L${i}` : (i <= 35) ? `R${i}` : `W${i}`;
    const res = results[qId];
    detailedSummary.push({
      num: i,
      qId: qId,
      userAns: res ? (res.user ?? "Chưa làm") : "Chưa làm",
      correctAns: res ? res.correct : "",
      isCorrect: res ? res.isCor : false
    });
  }

  let attemptCount = parseInt(localStorage.getItem(`attempt_${EXAM_CONFIG.examCode}`) || "0") + 1;
  localStorage.setItem(`attempt_${EXAM_CONFIG.examCode}`, attemptCount);

  // Submission payload matching teacher.html dashboard schema
  const submissionPayload = {
    studentName: studentName || "Thí sinh",
    studentClass: studentClass || "Tự do",
    examCode: EXAM_CONFIG.examCode,
    examTitle: EXAM_CONFIG.examTitle,
    attemptCount: attemptCount,
    durationFormatted: durationFormatted,
    score10: parseFloat(finalScore10),
    hskTotal: hskTotal,
    hskListening: `${correctL}/20`,
    hskReading: `${correctR}/15`,
    hskWriting: `${correctW}/10`,
    correctCount: correctCount,
    totalQuestions: 45,
    percent: Math.round((correctCount / 45) * 100),
    isPassed: isPassed,
    submitTime: new Date().toISOString(),
    detailedSummary: detailedSummary
  };

  // 1. Post to submissions.json (Directly read by Teacher Dashboard teacher.html)
  fetch("https://diemthihsk-marknguyen-default-rtdb.firebaseio.com/submissions.json", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(submissionPayload)
  }).then(r => r.json()).then(d => {
    console.log("Firebase sync to teacher dashboard success:", d);
    const syncEl = document.getElementById("firebaseSyncStatus");
    if (syncEl) {
      syncEl.innerHTML = `<span>🟢 Đã gửi bài nộp về cơ sở dữ liệu giáo viên (Firebase Realtime Database) thành công (${new Date().toLocaleTimeString('vi-VN')})</span>`;
      syncEl.className = "sync-status-box success";
      syncEl.style.display = "block";
    }
  }).catch(err => {
    console.warn("Firebase sync error:", err);
    const syncEl = document.getElementById("firebaseSyncStatus");
    if (syncEl) {
      syncEl.innerHTML = `<span>⚠️ Không thể kết nối mạng, kết quả đã được lưu tạm trong bộ nhớ máy học sinh.</span>`;
      syncEl.className = "sync-status-box offline";
      syncEl.style.display = "block";
    }
  });

  // 2. Post to scores.json as backup
  fetch("https://diemthihsk-marknguyen-default-rtdb.firebaseio.com/scores.json", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(submissionPayload)
  }).catch(e => {});

  // 3. Save to localStorage history
  try {
    const hist = JSON.parse(localStorage.getItem("hsk3_exam_history") || "[]");
    hist.unshift(submissionPayload);
    localStorage.setItem("hsk3_exam_history", JSON.stringify(hist.slice(0, 50)));

    const allSub = JSON.parse(localStorage.getItem("hsk3_all_class_submissions") || "[]");
    allSub.unshift(submissionPayload);
    localStorage.setItem("hsk3_all_class_submissions", JSON.stringify(allSub.slice(0, 100)));
  } catch(e) {}

  // Enter review mode
  document.body.classList.add("review-mode");
  
  // Highlight drawer buttons
  for (let i = 1; i <= 45; i++) {
    let qId = '';
    if (i <= 20) qId = `L${i}`;
    else if (i <= 35) qId = `R${i}`;
    else qId = `W${i}`;

    const res = results[qId];
    const btn = document.getElementById(`drawer-btn-${i}`);
    if (btn && res) {
      if (res.isCor) {
        btn.classList.add('correct-rev');
      } else {
        btn.classList.add('wrong-rev');
      }
    }
  }

  // Open drawer to see review
  const drawer = document.getElementById("examDrawer");
  if (drawer && !drawer.classList.contains("open")) {
    toggleExamDrawer();
  }

  alert(`KẾT QUẢ BÀI LÀM:\\n\\nThí sinh: ${studentName}\\nĐúng: ${correctCount}/45 câu\\nĐiểm số: ${finalScore10}/10\\n\\nBài làm đã được chuyển sang chế độ Xem Lại với đầy đủ đáp án và giải thích chi tiết.`);
}

// Initialize: Render exam immediately on DOM ready
window.addEventListener("DOMContentLoaded", () => {
  randomizeExamData();
  renderExam();
});
</script>
